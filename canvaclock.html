<!DOCTYPE html>
<html>
<body>

<canvas id="canvas" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let radius = canvas.height / 2;
ctx.translate(radius, radius);
radius = radius * 0.90;

drawClock();
setInterval(drawClock, 1000);

function drawClock() {
  drawFace(ctx, radius);
  drawScales(ctx, radius);
  drawNumbers(ctx, radius);
  drawDigitalTime(ctx, radius);
  drawTime(ctx, radius);
}

function drawFace(ctx, radius) {
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, 2 * Math.PI);
  ctx.fillStyle = '#1e3f66';
  ctx.fill();

  ctx.strokeStyle = '#d49a6a';
  ctx.lineWidth = radius * 0.06;
  ctx.stroke();
}

function drawScales(ctx, radius) {
  for (let i = 0; i < 60; i++) {
    let ang = i * Math.PI / 30;
    ctx.rotate(ang);
    ctx.beginPath();

    if (i % 5 === 0) {
      ctx.moveTo(0, -radius * 0.92);
      ctx.lineTo(0, -radius * 0.8);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
    } else {
      ctx.moveTo(0, -radius * 0.92);
      ctx.lineTo(0, -radius * 0.86);
      ctx.strokeStyle = '#cccccc';
      ctx.lineWidth = 1;
    }
    ctx.stroke();
    ctx.rotate(-ang);
  }
}

function drawNumbers(ctx, radius) {
  const romans = ["XII", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI"];
  ctx.font = radius * 0.12 + "px Georgia";
  ctx.fillStyle = "#ffffff";
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";

  for (let num = 0; num < 12; num++) {
    let ang = num * Math.PI / 6;
    ctx.rotate(ang);
    ctx.translate(0, -radius * 0.68);
    ctx.rotate(-ang);
    ctx.fillText(romans[num], 0, 0);
    ctx.rotate(ang);
    ctx.translate(0, radius * 0.68);
    ctx.rotate(-ang);
  }
}

function drawDigitalTime(ctx, radius) {
  const now = new Date();
  let h = String(now.getHours()).padStart(2, '0');
  let m = String(now.getMinutes()).padStart(2, '0');
  let s = String(now.getSeconds()).padStart(2, '0');

  ctx.font = radius * 0.11 + "px Arial";
  ctx.fillStyle = "#ffffff";
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";
  ctx.fillText(h + ":" + m + ":" + s, 0, radius * 0.35);
}

function drawTime(ctx, radius) {
  const now = new Date();
  let hour = now.getHours();
  let minute = now.getMinutes();
  let second = now.getSeconds();

  hour = hour % 12;
  hour = (hour * Math.PI / 6) + (minute * Math.PI / (6 * 60)) + (second * Math.PI / (360 * 60));
  drawPolygonHand(ctx, hour, radius * 0.48, radius * 0.045, "#f4b183");

  minute = (minute * Math.PI / 30) + (second * Math.PI / (30 * 60));
  drawPolygonHand(ctx, minute, radius * 0.72, radius * 0.03, "#ffffff");

  second = (second * Math.PI / 30);
  drawPolygonHand(ctx, second, radius * 0.82, radius * 0.015, "#ff7675");

  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.05, 0, 2 * Math.PI);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
}

function drawPolygonHand(ctx, pos, length, width, color) {
  ctx.beginPath();
  ctx.rotate(pos);
  ctx.moveTo(-width, 15);
  ctx.lineTo(0, -length);
  ctx.lineTo(width, 15);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.rotate(-pos);
}
</script>

</body>
</html>
