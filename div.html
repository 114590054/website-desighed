<!DOCTYPE html>
<html>
<head>
<style>
  div.content{
    overflow:auto;
    border:3px;
    resize:both;
    width:70%;
  }
  .blue{
    float:right;
    width:50%;
    background-color: #1faadb;
  }
  .green{
    float:left;
    width:50%;
    background-color: #8ebf42;
  }
  .row{
    display:flex;
  }
  .box{
    width:50%;
    padding:20px;
    background-color:lightblue;
  }
  
</style>
</head>
</html>
<body>
  <h1> Div side by side </h1>


  <div class="row">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
  </div>

  <div class="row">
    <div class="box">Box 3</div>
    <div class="box">Box 4</div>
  </div>
</body>
