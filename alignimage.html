<!DOCTYPE html>
<html>
<head>
  <title> quokka </title>
</head>
<body>
<div class="container">
  <!-- 第一個區塊：文字在左、圖片在右 -->
  <section class="card">
    <div class="text-content">
      <h2>The Quokka</h2>
      <p>
        The quokka 
      </p>
    </div>
    <div class="image-content">
      <img src="quokka.jpg" alt="A friendly quokka smiling" />
    </div>
  </section>

  <!-- 第二個區塊：圖片在左、文字在右（加上 reverse class） -->
  <section class="card reverse">
    <div class="image-content">
      <img src="island.jpg" alt="Rottnest Island beach view" />
    </div>
    <div class="text-content">
      <h2>Where They Live</h2>
      <p>
        Quokkas are mainly found on Rottnest Island and some other nearby islands in
        Western Australia. They live in bushland, grasslands, and coastal areas where
        there is plenty of food and shelter.
      </p>
    </div>
  </section>
</div>

</html>
