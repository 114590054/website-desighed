<!DOCTYPE html>
<html>
<head>
  <style>
    table ,td{
      border:1px solid black;
      border-collapse:collapse;
      text-align:left;
      padding:4px ,6px;
    }
  </style>
</head>
<body>
  <table id = "mytable"></table>
  
  <script>
    let table = document.getElementById("mytable");
    let html = "";
    for (j = 1; j <= 9; j++) {
     html += "<tr>";
      for (i = 2; i <= 9; i++) {
        html += "<td>" + i + " × " + j + " = " + (i * j) + "</td>";
      }
      html "</tr>";
    }
    table.innerHTML = html;
  </script>
  
</body>
</html>
