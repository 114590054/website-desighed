<!DOCTYPE html>
<html>
<head>
  <style>
    table ,td{
      border-collapse:collapse;
      text-align:center;
    }
  </style>
</head>
<body>
  <script>
    document.write("<table>");
    for (j = 1; j <= 9; j++) {
      document.write("<tr>");
      for (i = 2; i <= 9; i++) {
        document.write("<td>" + i + " × " + j + " = " + (i * j) + "</td>");
      }
      document.write("</tr>");
    }
    document.write("</table>");
  </script>
  
</body>
</html>
