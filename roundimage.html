<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    .container {
      position: relative;
      width: 200px;
      height: 200px;
    }
    
    .image {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100%;
      width: 100%;
      opacity: 0;
      transition: .5s ease;
      background-color: #c2185b;
      border-radius: 50%;
    }

    /* 滑鼠懸停 (hover) 時，漸變顯示覆蓋層 */
    .container:hover .overlay {
      opacity: 0.9; /* 保持微透明以看得到底圖 */
    }

    .text {
      position: absolute;
      bottom: 25px;               /* 距離圓形底部 25px，把文字固定在靠近底端的位置 */
      left: 50%;                  /* 水平定位在 50% 處 */
      transform: translateX(-50%); /* 往回修正文字自身寬度的一半，達成精準水平置中 */
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2> Round Images </h2>
  <div class="container">
    <img src="quokka.jpg" alt="Quokka" class="image">
    <div class="overlay">
      <div class="text"> Quokka</div>
    </div>
  </div>
</body>
</html>
